name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  # Don't cancel a main build halfway through replacing the release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # needed to replace the "latest" release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No wrapper jar in the repo yet, so let the action provide Gradle.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build release APK (R8 + resource shrinking)
        run: gradle assembleRelease --stacktrace

      - name: Collect outputs
        run: |
          cp app/build/outputs/apk/release/app-release.apk dwm-sync.apk
          cp app/build/outputs/mapping/release/mapping.txt dwm-sync-mapping.txt
          echo "APK_SIZE=$(du -h dwm-sync.apk | cut -f1)" >> "$GITHUB_ENV"
          echo "APK size: $(du -h dwm-sync.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      # Pull requests: keep the APK as a run artifact only.
      - name: Upload APK (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dwm-sync-pr-${{ github.event.pull_request.number }}
          path: |
            dwm-sync.apk
            dwm-sync-mapping.txt
          retention-days: 7

      # main: replace the rolling "latest" pre-release. Re-creating it each time
      # keeps it the newest release, so it always sits at the top of the list.
      - name: Publish "Latest release"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          {
            echo "Automatic build of \`main\` at ${SHORT_SHA} ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            echo
            echo "**Install:** download \`dwm-sync.apk\` (${APK_SIZE}) below on your Android phone and open it. Allow installs from your browser if asked."
            echo
            echo "Each build installs over the previous one, so your settings and history are kept. \`dwm-sync-mapping.txt\` turns obfuscated crash traces back into readable ones."
            echo
            echo "### Latest change"
            git log -1 --pretty='- %s'
          } > notes.md

          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dwm-sync.apk dwm-sync-mapping.txt \
            --title "Latest release" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes-file notes.md
